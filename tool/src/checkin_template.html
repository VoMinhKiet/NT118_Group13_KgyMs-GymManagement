<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KgyMs – QR điểm danh</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px; background: #0b0e15; color: #f5f5fc;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .sub { margin: 0; color: #a1acbe; }
  .card {
    background: #fff; border-radius: 24px; padding: 20px;
    width: min(80vh, 90vw); aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; }
  .bar { width: min(80vh, 90vw); height: 8px; background: #292e3b; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: #a64dff; transition: width 0.25s linear; }
  .meta { color: #a1acbe; font-size: 14px; }
  form { display: flex; flex-direction: column; gap: 12px; width: min(480px, 90vw);
         background: #1b2130; border: 1px solid #292e3b; border-radius: 20px; padding: 24px; }
  input { padding: 12px; border-radius: 12px; border: 1px solid #292e3b; background: #0b0e15; color: inherit; font-size: 15px; }
  button { padding: 12px; border: 0; border-radius: 12px; background: #a64dff; color: #fff; font-size: 15px; cursor: pointer; }
  .link { background: none; color: #a1acbe; padding: 4px; font-size: 13px; text-decoration: underline; }
  .error { color: #ff788e; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <section id="setup" hidden>
    <form id="setupForm">
      <h1>Cài đặt mã điểm danh</h1>
      <p class="sub">Dán <b>checkInSecret</b> (Firebase → <code>gymInfo/checkInSecret</code>). Secret chỉ lưu trong trình duyệt này, không nằm trong file.</p>
      <input id="secretInput" autocomplete="off" spellcheck="false" placeholder="checkInSecret">
      <p class="error" id="setupError" hidden>Secret phải dài ít nhất 16 ký tự.</p>
      <button type="submit">Lưu và hiển thị mã</button>
    </form>
  </section>

  <section id="display" hidden style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <h1>KgyMs Gym – Quét để điểm danh</h1>
    <p class="sub">Mở app KgyMs → QR → Quét QR điểm danh. Quét lần nữa khi ra về để check-out.</p>
    <div class="card"><canvas id="qr" width="600" height="600"></canvas></div>
    <div class="bar"><div id="progress"></div></div>
    <div class="meta"><span id="countdown"></span> • <span id="clock"></span></div>
    <button class="link" id="resetSecret" type="button">Đổi secret</button>
  </section>

<script>
/*__QR_JS__*/
</script>
<script>
(function () {
  "use strict";
  var STORAGE_KEY = "kgyms.checkInSecret";
  var PREFIX = "KGYMS-CHECKIN";
  var PERIOD = 30;            // giây, khớp CheckInCode.PERIOD_SECONDS
  var SIG_LENGTH = 8;

  var setup = document.getElementById("setup");
  var display = document.getElementById("display");
  var canvas = document.getElementById("qr");
  var lastWindow = null;

  function secret() { return localStorage.getItem(STORAGE_KEY) || ""; }

  function codeFor(windowNo) {
    var sig = KgQr.hmacSha256Hex(secret(), String(windowNo)).slice(0, SIG_LENGTH);
    return PREFIX + ":" + windowNo + ":" + sig;
  }

  function draw(text) {
    var m = KgQr.encode(text), quiet = 4, n = m.length + quiet * 2;
    var ctx = canvas.getContext("2d"), cell = Math.floor(canvas.width / n);
    var offset = Math.floor((canvas.width - cell * n) / 2);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000";
    for (var y = 0; y < m.length; y++) for (var x = 0; x < m.length; x++) {
      if (m[y][x]) ctx.fillRect(offset + (x + quiet) * cell, offset + (y + quiet) * cell, cell, cell);
    }
  }

  function tick() {
    var nowSec = Date.now() / 1000;
    var windowNo = Math.floor(nowSec / PERIOD);
    if (windowNo !== lastWindow) { lastWindow = windowNo; draw(codeFor(windowNo)); }
    var left = PERIOD - (nowSec % PERIOD);
    document.getElementById("progress").style.width = (left / PERIOD * 100) + "%";
    document.getElementById("countdown").textContent = "Mã mới sau " + Math.ceil(left) + " giây";
    document.getElementById("clock").textContent = new Date().toLocaleTimeString("vi-VN");
  }

  function show() {
    var ready = secret().length >= 16;
    setup.hidden = ready;
    display.hidden = !ready;
    if (ready) { lastWindow = null; tick(); }
  }

  document.getElementById("setupForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var value = document.getElementById("secretInput").value.trim().replace(/^"|"$/g, "");
    var ok = value.length >= 16;
    document.getElementById("setupError").hidden = ok;
    if (ok) { localStorage.setItem(STORAGE_KEY, value); show(); }
  });
  document.getElementById("resetSecret").addEventListener("click", function () {
    if (confirm("Xoá secret đã lưu và nhập lại?")) { localStorage.removeItem(STORAGE_KEY); show(); }
  });

  setInterval(function () { if (!display.hidden) tick(); }, 250);
  show();
})();
</script>
</body>
</html>
